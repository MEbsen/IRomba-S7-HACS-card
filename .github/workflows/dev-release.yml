name: Dev prerelease
on:
  push:
    branches: [dev]
    paths: ["src/**", "scripts/**", "package.json", ".github/workflows/dev-release.yml"]
permissions:
  contents: write
jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and smoke test
        run: npm run check
      - name: Read card version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^const CARD_VERSION = "\([^"]*\)";/\1/p' src/iroomba-s7-card.js)
          test -n "$VERSION"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$'
          test "$VERSION" = "$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish tested HACS bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          cp dist/iroomba-s7-card.js iroomba-s7-card.js
          node scripts/smoke-test.mjs iroomba-s7-card.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iroomba-s7-card.js
          if ! git diff --cached --quiet; then
            git commit -m "Build v${{ steps.version.outputs.version }} HACS bundle"
            git push origin HEAD:dev
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          gh release create "$TAG" iroomba-s7-card.js --target "${{ steps.bundle.outputs.sha }}" --prerelease --title "$TAG" --generate-notes
