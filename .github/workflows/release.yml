name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read and verify version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^const CARD_VERSION = "\([^"]*\)";/\1/p' src/iroomba-s7-card.js)
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          test "$VERSION" = "$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          test "${{ github.event.head_commit.message }}" = "Release ${TAG}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then exit 1; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Build and smoke test
        run: npm run check
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: plugin
      - name: Create release artifacts
        run: |
          mkdir -p release
          cp dist/iroomba-s7-card.js release/iroomba-s7-card.js
          cd release
          zip iroomba-s7-card.zip iroomba-s7-card.js
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" release/iroomba-s7-card.js release/iroomba-s7-card.zip --target "$GITHUB_SHA" --title "iRoomba S7 Card $TAG" --generate-notes
